name: localdiet
description: "Acompanhamento nutricional offline com a tabela TACO"
publish_to: 'none'

version: 2.2.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/taco.jsonl
    - assets/data/measures.jsonl
